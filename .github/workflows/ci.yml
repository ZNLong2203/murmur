name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The commons tests resolve species names from the generated label table.
      - run: node scripts/fetch-models.mjs --labels-only
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
